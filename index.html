<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1763d3"><title>Central de Achados | Ofertas</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17243b;font:16px system-ui,Arial}header{background:linear-gradient(115deg,#064bb3,#2386e8);color:white;padding:24px 18px}header>div,main{max-width:1100px;margin:auto}h1{margin:0;font-size:30px}header p{margin:8px 0 20px}input{width:100%;padding:15px;border:0;border-radius:12px;font-size:16px}.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 18px}button{border:1px solid #cbd8ec;background:white;padding:10px 14px;border-radius:22px;white-space:nowrap;cursor:pointer}.active{background:#1763d3;color:white}main{padding:22px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.card{background:white;border:1px solid #e0e8f2;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.media{height:165px;background:#e8f0ff;display:grid;place-items:center;font-size:50px}.content{padding:15px;display:flex;flex-direction:column;flex:1}.tag{font-size:12px;color:#426a9c;font-weight:700}.card h2{font-size:17px;line-height:1.35;margin:9px 0}.card p{font-size:13px;color:#64748b;flex:1}.buy{background:#1763d3;color:white;text-decoration:none;text-align:center;border-radius:10px;padding:12px;font-weight:700}footer{padding:26px 18px;text-align:center;color:#607087;font-size:13px}</style></head>
<body><header><div><h1>🛍️ Central de Achados</h1><p>Produtos selecionados para você conferir nas lojas parceiras</p><input id="search" type="search" placeholder="Pesquisar produtos..." aria-label="Pesquisar produtos"></div></header><main><div class="filters" id="filters"></div><p id="count" aria-live="polite"></p><div id="grid" class="grid"></div></main><footer>Divulgação de afiliados: podemos receber comissão por compras elegíveis. Preços, estoque e condições são definidos pela loja. Não somos o Mercado Livre nem a Shopee.</footer>
<script>
const products=[
{title:"Whey Isolate Protein Fuse 900 g — Dark Lab",category:"Saúde",store:"Mercado Livre",url:"https://meli.la/1jzvzZZ",icon:"💪"},
{title:"Tênis Puma Carina Street",category:"Moda",store:"Mercado Livre",url:"https://meli.la/1JyoN4y",icon:"👟"},
{title:"Motorola Moto G06 64 GB",category:"Eletrônicos",store:"Mercado Livre",url:"https://meli.la/12U18oP",icon:"📱"},
{title:"Tapete Felpudo Cinza 2,00 × 1,50 m",category:"Casa",store:"Mercado Livre",url:"https://meli.la/27jwJAY",icon:"🏠"},
{title:"Jogo de Lençol Queen 400 Fios — 3 Peças",category:"Casa",store:"Mercado Livre",url:"https://meli.la/14CcJJn",icon:"🛏️"},
{title:"Kit 5 Peças All Black Dry",category:"Moda",store:"Mercado Livre",url:"https://meli.la/192B9tJ",icon:"👕"},
{title:"Quasar Blue Desodorante Colônia 100 ml",category:"Beleza",store:"Mercado Livre",url:"https://meli.la/1xNFGWh",icon:"✨"},
{title:"Fechadura Digital Intelbras FD1000",category:"Casa",store:"Mercado Livre",url:"https://meli.la/2AueXfe",icon:"🔐"}];
let category="Todos";const grid=document.querySelector("#grid"),filters=document.querySelector("#filters"),search=document.querySelector("#search");function render(){filters.replaceChildren();for(const c of ["Todos",...new Set(products.map(p=>p.category))]){const b=document.createElement("button");b.textContent=c;b.className=c===category?"active":"";b.onclick=()=>{category=c;render()};filters.append(b)}grid.replaceChildren();const q=search.value.toLocaleLowerCase("pt-BR");const found=products.filter(p=>(category==="Todos"||p.category===category)&&p.title.toLocaleLowerCase("pt-BR").includes(q));document.querySelector("#count").textContent=found.length+" achados";for(const p of found){const card=document.createElement("article");card.className="card";const media=document.createElement("div");media.className="media";media.textContent=p.icon;media.setAttribute("aria-label","Imagem oficial ainda não disponível");const body=document.createElement("div");body.className="content";const tag=document.createElement("span");tag.className="tag";tag.textContent=p.category+" · "+p.store;const h=document.createElement("h2");h.textContent=p.title;const desc=document.createElement("p");desc.textContent="Consulte as fotos, o preço e a disponibilidade no anúncio original.";const a=document.createElement("a");a.className="buy";a.href=p.url;a.target="_blank";a.rel="noopener noreferrer sponsored";a.textContent="Ver produto na loja";body.append(tag,h,desc,a);card.append(media,body);grid.append(card)}}search.addEventListener("input",render);render();
</script></body></html>
